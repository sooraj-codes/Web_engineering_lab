<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 2 - Text Formatting</title>
</head>
<body>
    <h1>Text Formatting Demonstration</h1>

    <p><strong>Important</strong> (Strong / Bold text)</p>
    <p>This is <em>emphasized text</em>.</p>
    <p><u>Underlined text</u></p>
    <p><mark>Highlighted text</mark></p>
    <p><del>Old information</del></p>
    <p><ins>New information</ins></p>
    <p>H<sub>2</sub>O (Subscript example)</p>
    <p>x<sup>2</sup> (Superscript example)</p>
</body>
</html>
